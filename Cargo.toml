[package]
name = "stm32f4-usb-mic"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["live-mic", "noise-suppression"]
pdm-capture = []
live-mic = ["pdm-capture"]
noise-suppression = ["live-mic"]
adaptive-noise = ["noise-suppression"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "stm32f4-usb-mic"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "none")'.dependencies]
# One reviewed upstream revision: AudioSource is not in the crates.io 0.6 release.
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "9f9f1f1bdc6775347b9f3119921da65d56ca3651", features = ["defmt", "rt", "stm32f407vg", "time-driver-tim2", "unstable-pac"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "9f9f1f1bdc6775347b9f3119921da65d56ca3651", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "9f9f1f1bdc6775347b9f3119921da65d56ca3651", features = ["defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "9f9f1f1bdc6775347b9f3119921da65d56ca3651", features = ["defmt", "tick-hz-1_000_000"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "9f9f1f1bdc6775347b9f3119921da65d56ca3651" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
# A debugger may leave the RTT channel in blocking mode after disconnecting.
# Never wait for a log reader with interrupts masked while USB audio is running.
defmt-rtt = { version = "1.0", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"
critical-section = "1.2"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3
overflow-checks = true

[profile.dev]
debug = 2
opt-level = 1
